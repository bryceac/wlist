[package]
name = "wlist"
authors = ["Bryce Campbell <tonyhawk2100@gmail.com>"]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CLI wishlist registry that can be used to produce shareable wishlists with others."
homepage = "https://github.com/bryceac/wlist"
readme = "README.md"
repository = "https://github.com/bryceac/wlist"
keywords = ["wlist", "wishlist", "wish", "list", "commandline", "cli"]

[dependencies]
clap = { version = "4.5.57", features = ["derive"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
shellexpand = "3.1.1"
url = "2.5.8"
url_path = "0.1.3"
wlitem = "0.1.2"

[package.metadata.deb]
license-file = ["LICENSE", "4"]
extended-description = """\
A simple CLI based checkbook ledger to help \
keep track of finances."""
section = "unknown"
priority = "optional"
assets = [
    ["target/release/wlist", "usr/local/bin/", "755"],
    ["gift_registry.sql", "usr/local/share/wlist/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/wlist", dest = "/usr/local/bin/", mode = "755" },
    { source = "gift_registry.sql", dest = "/usr/local/share/wlist/", mode = "644" }
]