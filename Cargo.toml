[package]
name = "wlist"
authors = ["Bryce Campbell <tonyhawk2100@gmail.com>"]
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "CLI wishlist registry that can be used to produce shareable wishlists with others."
homepage = "https://github.com/bryceac/wlist"
readme = "README.md"
repository = "https://github.com/bryceac/wlist"
keywords = ["wlist", "wishlist", "wish", "list", "commandline", "cli"]

[dependencies]
calamine = "0.37.0"
clap = { version = "4.5.57", features = ["derive"] }
clap-stdin = "1.0.0"
http = "1.5.0"
icu = "2.3.1"
indexmap = "2.13.0"
rusqlite = { version = "0.38.0", features = ["bundled"] }
shellexpand = "3.1.1"
spreadsheet-ods = "1.0.4"
url_path = "0.1.3"
wlitem = "0.1.3"
xlsxwriter = "0.6.1"

[package.metadata.deb]
license-file = ["LICENSE", "4"]
extended-description = """\
A simple CLI based checkbook ledger to help \
keep track of finances."""
section = "unknown"
priority = "optional"
assets = [
    ["target/release/wlist", "usr/local/bin/", "755"],
    ["man/wlist.1", "usr/local/share/man1/", "644"],
    ["man/wlist-add.1", "usr/local/share/man1/", "644"],
    ["man/wlist-delete.1", "usr/local/share/man1/", "644"],
    ["man/wlist-export.1", "usr/local/share/man1/", "644"],
    ["man/wlist-import.1", "usr/local/share/man1/", "644"],
    ["man/wlist-show.1", "usr/local/share/man1/", "644"],
    ["man/wlist-update.1", "usr/local/share/man1/", "644"]
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/wlist", dest = "/usr/local/bin/", mode = "755" },
    { source = "man/wlist.1", dest = "/usr/local/share/man1/", mode = "644"},
    { source = "man/wlist-add.1", dest = "/usr/local/share/man1/", "644"},
    { source = "man/wlist-delete.1", dest = "/usr/local/share/man1/", mode = "644"},
    { source = "man/wlist-export.1", dest = "/usr/local/share/man1/", mode = "644"},
    { source = "man/wlist-import.1", dest = "/usr/local/share/man1/", mode = "644"},
    { source = "man/wlist-show.1", dest = "/usr/local/share/man1/", mode = "644"},
    { source = "man/wlist-update.1", dest = "/usr/local/share/man1/", mode = "644"}
]
